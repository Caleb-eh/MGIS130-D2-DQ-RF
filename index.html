<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Spark - Inspiration & Facts</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* Global Reset & Base Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      overflow-x: hidden;
      color: var(--text-main, #ffffff);
      background-color: var(--bg-primary, #0f172a);
      transition: background-color 0.4s ease, color 0.4s ease;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: var(--bg-image, linear-gradient(135deg, #0f172a 0%, #1e293b 100%));
      background-size: cover;
      background-position: center;
      z-index: -1;
      transition: all 0.5s ease-in-out;
      filter: brightness(0.65) blur(2px);
      transform: scale(1.02);
    }

    /* THEMES */
    body.theme-philosophy {
      --bg-primary: #0b1329;
      --bg-secondary: rgba(15, 23, 42, 0.85);
      --bg-card: rgba(15, 23, 42, 0.82);
      --border-card: rgba(251, 191, 36, 0.3);
      --accent: #fbbf24;
      --accent-hover: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --quote-color: #fef3c7;
      --bg-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(251, 191, 36, 0.25);
    }

    body.theme-inspirational {
      --bg-primary: #1c0a27;
      --bg-secondary: rgba(45, 16, 58, 0.85);
      --bg-card: rgba(35, 12, 48, 0.82);
      --border-card: rgba(251, 146, 60, 0.35);
      --accent: #fb923c;
      --accent-hover: #f97316;
      --text-main: #ffffff;
      --text-muted: #fed7aa;
      --quote-color: #ffedd5;
      --bg-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(251, 146, 60, 0.3);
    }

    body.theme-technology {
      --bg-primary: #030712;
      --bg-secondary: rgba(17, 24, 39, 0.9);
      --bg-card: rgba(15, 23, 42, 0.88);
      --border-card: rgba(6, 182, 212, 0.4);
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --quote-color: #cff4fc;
      --bg-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(6, 182, 212, 0.35);
    }

    body.theme-history {
      --bg-primary: #1c1917;
      --bg-secondary: rgba(41, 37, 36, 0.88);
      --bg-card: rgba(28, 25, 23, 0.85);
      --border-card: rgba(217, 119, 6, 0.35);
      --accent: #d97706;
      --accent-hover: #b45309;
      --text-main: #f5f5f4;
      --text-muted: #d6d3d1;
      --quote-color: #fef3c7;
      --bg-image: url('https://images.unsplash.com/photo-1461360370896-922624d12aa1?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(217, 119, 6, 0.3);
    }

    body.theme-literature {
      --bg-primary: #1e1b4b;
      --bg-secondary: rgba(30, 27, 75, 0.85);
      --bg-card: rgba(24, 20, 68, 0.82);
      --border-card: rgba(168, 85, 247, 0.35);
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --text-main: #ffffff;
      --text-muted: #e9d5ff;
      --quote-color: #f3e8ff;
      --bg-image: url('https://images.unsplash.com/photo-1457369804613-52c61a468e7d?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(168, 85, 247, 0.3);
    }

    body.theme-sports {
      --bg-primary: #022c22;
      --bg-secondary: rgba(6, 78, 59, 0.85);
      --bg-card: rgba(4, 47, 38, 0.82);
      --border-card: rgba(34, 197, 94, 0.35);
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --text-main: #ffffff;
      --text-muted: #bbf7d0;
      --quote-color: #dcfce7;
      --bg-image: url('https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(34, 197, 94, 0.3);
    }

    body.theme-forest {
      --bg-primary: #052e16;
      --bg-secondary: rgba(20, 83, 45, 0.85);
      --bg-card: rgba(20, 83, 45, 0.8);
      --border-card: rgba(74, 222, 128, 0.3);
      --accent: #4ade80;
      --accent-hover: #22c55e;
      --text-main: #ffffff;
      --text-muted: #dcfce7;
      --quote-color: #f0fdf4;
      --bg-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(74, 222, 128, 0.25);
    }

    body.theme-nordic {
      --bg-primary: #0f172a;
      --bg-secondary: rgba(30, 41, 59, 0.88);
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-card: rgba(56, 189, 248, 0.3);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --quote-color: #e0f2fe;
      --bg-image: url('https://images.unsplash.com/photo-1517411032315-54ef2cb783bb?q=80&w=2000&auto=format&fit=crop');
      --shadow-glow: rgba(56, 189, 248, 0.25);
    }

    /* LAYOUT */
    .main-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .greeting-heading {
      font-size: 1.875rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--accent);
      text-shadow: 0 0 15px var(--shadow-glow);
    }

    .datetime-widget {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .dot-separator { opacity: 0.5; }
    .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0.8;
      margin-top: 0.15rem;
    }

    .hamburger-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-card);
      padding: 0.75rem;
      border-radius: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .hamburger-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--shadow-glow);
    }

    .hamburger-btn .bar {
      width: 22px;
      height: 2px;
      background-color: var(--text-main);
      border-radius: 2px;
    }

    .content-wrapper {
      margin: 2rem 0;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 12px 30px -5px var(--shadow-glow);
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 0.35rem;
      border-radius: 0.5rem;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .icon-btn:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.1);
    }

    .quote-body {
      font-size: 1.25rem;
      line-height: 1.6;
      font-weight: 500;
      color: var(--quote-color);
      font-style: italic;
      margin-bottom: 1rem;
    }

    .author {
      font-size: 0.95rem;
      font-weight: 600;
      text-align: right;
      color: var(--accent);
    }

    .fact-card {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .primary-btn {
      background-color: var(--accent);
      color: #000000;
      box-shadow: 0 4px 14px var(--shadow-glow);
    }

    .primary-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--shadow-glow);
    }

    .keyboard-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    kbd {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.25rem;
      padding: 0.1rem 0.4rem;
      font-family: monospace;
    }

    /* DRAWER */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
    }

    .drawer-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-card);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      padding: 2rem;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(16px);
      overflow-y: auto;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .drawer-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.75rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover { color: var(--accent); }

    .form-group { margin-bottom: 1.5rem; }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .form-group select {
      width: 100%;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-card);
      border-radius: 0.5rem;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group select:focus { border-color: var(--accent); }

    .toast-message {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: #000000;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 60;
      pointer-events: none;
    }

    .toast-message.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="theme-philosophy min-h-screen font-sans antialiased">

  <div class="bg-overlay"></div>

  <!-- MAIN APP CONTAINER -->
  <main class="main-screen">
    <header class="top-nav">
      <div class="header-center">
        <!-- DYNAMIC TIME-BASED GREETING -->
        <h1 id="greeting-heading" class="greeting-heading">Daily Spark</h1>
        <div class="datetime-widget">
          <span id="current-date">Today</span>
          <span class="dot-separator">•</span>
          <span id="current-time">12:00 PM</span>
        </div>
        <p class="tagline">Your daily dose of quotes & fascinating trivia</p>
      </div>

      <!-- Hamburger Menu Button -->
      <button id="open-drawer-btn" class="hamburger-btn" aria-label="Open Settings">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </header>

    <!-- CONTENT CARDS -->
    <section class="content-wrapper">
      <div class="content-container">

        <!-- QUOTE CARD -->
        <article class="card animate-in">
          <div class="card-header-row">
            <span id="quote-category-label" class="card-label">Quote • Wisdom & Philosophy</span>
            <div class="card-actions-mini">
              <button id="copy-quote-btn" class="icon-btn" title="Copy Quote">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
          <div class="quote-body">
            <p id="quote-text">"Loading quote..."</p>
          </div>
          <p id="quote-author" class="author">— Author</p>
        </article>

        <!-- FACT CARD -->
        <article class="card animate-in">
          <div class="card-header-row">
            <span id="fact-category-label" class="card-label">Fact • General Trivia</span>
            <div class="card-actions-mini">
              <button id="copy-fact-btn" class="icon-btn" title="Copy Fact">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
          <div class="fact-card">
            <p id="fact-text">Loading random fact...</p>
          </div>
        </article>

        <!-- GENERATE BUTTON & HINT -->
        <div class="actions">
          <button id="fetch-new-btn" class="btn primary-btn">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Get New Spark</span>
          </button>
          <button id="randomize-all-btn" class="btn secondary-btn bg-white/10 hover:bg-white/20 text-white border border-white/20">
            <i class="fa-solid fa-shuffle"></i>
            <span>Surprise Me!</span>
          </button>
        </div>
        <p class="keyboard-hint mt-2">Press <kbd>Spacebar</kbd> to refresh • Press <kbd>R</kbd> to randomize everything</p>

      </div>
    </section>
  </main>

  <!-- DRAWER BACKDROP OVERLAY -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <!-- SLIDE-OUT SETTINGS DRAWER -->
  <aside id="settings-drawer" class="drawer">
    <div class="drawer-header">
      <h3>Preferences & Topics</h3>
      <button id="close-drawer-btn" class="close-btn" aria-label="Close Settings">&times;</button>
    </div>

    <form id="settings-form" onsubmit="event.preventDefault();">
      <!-- User Name Field -->
      <div class="form-group">
        <label for="user-name-input"><i class="fa-solid fa-user mr-2"></i>Your Name</label>
        <input type="text" id="user-name-input" placeholder="Enter your name" class="w-full p-3 rounded-lg text-sm bg-black/40 border border-[var(--border-card)] text-[var(--text-main)] outline-none focus:border-[var(--accent)] transition-colors" />
      </div>

      <!-- Theme Selection -->
      <div class="form-group">
        <label for="theme-select"><i class="fa-solid fa-palette mr-2"></i>App Visual Theme</label>
        <select id="theme-select">
          <option value="theme-philosophy">Misty Mountain Peaks</option>
          <option value="theme-inspirational">Golden Tropical Sunset</option>
          <option value="theme-technology">Neon Cyber Circuit</option>
          <option value="theme-history">Vintage Parchment & Quill</option>
          <option value="theme-literature">Cozy Antique Library</option>
          <option value="theme-sports">Night Stadium Lights</option>
          <option value="theme-forest">Emerald Canopy Forest</option>
          <option value="theme-nordic">Glacier Ice Frost</option>
        </select>
      </div>

      <!-- Quote Category Selection -->
      <div class="form-group">
        <label for="category-select"><i class="fa-solid fa-quote-left mr-2"></i>Quote Subject</label>
        <select id="category-select">
          <option value="philosophy">Wisdom & Philosophy</option>
          <option value="inspirational">Inspirational & Life</option>
          <option value="technology">Technology & Science</option>
          <option value="history">Historical & Classics</option>
          <option value="literature">Literature & Poetry</option>
          <option value="sports">Athletics & Competition</option>
        </select>
      </div>

      <!-- Fact Topic Selection -->
      <div class="form-group">
        <label for="fact-topic-select"><i class="fa-solid fa-lightbulb mr-2"></i>Fact Topic</label>
        <select id="fact-topic-select">
          <option value="useless">General Trivia & Fun Facts</option>
          <option value="trivia">Math & Number Trivia</option>
          <option value="date">Historical Events & Dates</option>
          <option value="year">Year in History Trivia</option>
        </select>
      </div>

      <!-- Greeting Display Mode Option -->
      <div class="form-group">
        <label for="greeting-style-select"><i class="fa-solid fa-clock mr-2"></i>Greeting Header</label>
        <select id="greeting-style-select">
          <option value="time-based">Time-of-Day Greeting (Morning/Afternoon/Evening)</option>
          <option value="holiday-api">Today's Holiday / Observance</option>
        </select>
      </div>

      <button id="save-settings-btn" class="btn primary-btn w-full mt-20" type="button">
        Save Preferences
      </button>
    </form>
  </aside>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast-message">Copied to clipboard!</div>

        { text: "It is never too late to be what you might have been.", author: "George Eliot" },
        { text: "There is no friend as loyal as a book.", author: "Ernest Hemingway" },
        { text: "Words are, in my not-so-humble opinion, our most inexhaustible source of magic.", author: "J.K. Rowling" },
        { text: "There is no agony like bearing an untold story inside you.", author: "Maya Angelou" },
        { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" }
      ],
      sports: [
        { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
        { text: "It's not whether you get knocked down, it's whether you get up.", author: "Vince Lombardi" },
        { text: "Hard work beats talent when talent fails to work hard.", author: "Tim Notke" },
        { text: "I've failed over and over and over again in my life. And that is why I succeed.", author: "Michael Jordan" },
        { text: "The more difficult the victory, the greater the happiness in winning.", author: "Pelé" },
        { text: "Float like a butterfly, sting like a bee.", author: "Muhammad Ali" }
      ]
    };

    // Category endpoint map with fallback strategy
    const QUOTE_TAG_MAP = {
      philosophy: 'philosophy,wisdom',
      inspirational: 'inspirational,motivational',
      technology: 'technology,science',
      history: 'history,history-classics',
      literature: 'literature,poetry',
      sports: 'sports,competition'
    };

    const LOCAL_FACT_BACKUPS = {
      useless: [
        "A flock of crows is known as a murder.",
        "Honey never spoils. Trace amounts of edible honey have been found in ancient Egyptian tombs.",
        "Bananas are curved because they grow towards the sun against gravity.",
        "Wombat poop is cube-shaped to keep it from rolling away.",
        "Sea otters hold hands while sleeping so they don't drift apart."
      ],
      trivia: [
        "Venus is the only planet in our solar system that spins clockwise.",
        "The heart of a shrimp is located in its head.",
        "An octopus has three hearts and blue blood.",
        "Cats have 32 muscles in each of their outer ears.",
        "Sound travels about four times faster in water than it does in air."
      ],
      date: [
        "In 1912, the Titanic sank on its maiden voyage across the Atlantic.",
        "On July 20, 1969, humans first walked on the Moon during Apollo 11.",
        "The Eiffel Tower was officially opened on March 31, 1889.",
        "On October 24, 1945, the United Nations was officially established.",
        "The Berlin Wall fell on November 9, 1989, reuniting East and West Germany."
      ],
      year: [
        "In 1969, ARPANET sent its first message, laying the groundwork for today's Internet.",
        "In 1903, the Wright brothers achieved the first powered, sustained human flight.",
        "In 1989, the Berlin Wall fell, marking a pivotal historical moment.",
        "In 1977, Apple Computer was incorporated and launched the Apple II.",
        "In 1928, Alexander Fleming discovered penicillin, revolutionizing modern medicine."
      ]
    };

    // DOM Elements
    const greetingHeadingEl = document.getElementById('greeting-heading');
    const userNameInput = document.getElementById('user-name-input');
    const quoteTextEl = document.getElementById('quote-text');
    const quoteAuthorEl = document.getElementById('quote-author');
    const quoteCategoryLabelEl = document.getElementById('quote-category-label');
    const factTextEl = document.getElementById('fact-text');
    const factCategoryLabelEl = document.getElementById('fact-category-label');
    const refreshBtn = document.getElementById('fetch-new-btn');
    const randomizeBtn = document.getElementById('randomize-all-btn');
    const drawer = document.getElementById('settings-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    const openDrawerBtn = document.getElementById('open-drawer-btn');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const themeSelect = document.getElementById('theme-select');
    const categorySelect = document.getElementById('category-select');
    const factTopicSelect = document.getElementById('fact-topic-select');
    const greetingStyleSelect = document.getElementById('greeting-style-select');
    const toast = document.getElementById('toast');
    const copyQuoteBtn = document.getElementById('copy-quote-btn');
    const copyFactBtn = document.getElementById('copy-fact-btn');

    // Time-based greeting
    function updateTimeBasedGreeting() {
      const now = new Date();
      const hour = now.getHours();
      const userName = userNameInput?.value?.trim();
      const nameSuffix = userName ? `, ${userName}` : '';

      let timeGreeting = "Hello";
      if (hour >= 5 && hour < 12) timeGreeting = "Good Morning ☀️";
      else if (hour >= 12 && hour < 17) timeGreeting = "Good Afternoon 🌤️";
      else if (hour >= 17 && hour < 22) timeGreeting = "Good Evening 🌙";
      else timeGreeting = "Good Night ✨";

      greetingHeadingEl.textContent = `${timeGreeting}${nameSuffix}`;
    }

    async function fetchHolidayGreeting() {
      const userName = userNameInput?.value?.trim();
      const nameSuffix = userName ? `, ${userName}` : '';

      try {
        const res = await fetch('https://date.nager.at/api/v3/NextPublicHolidaysWorldwide');
        if (!res.ok) throw new Error("Holiday API failed");
        const holidays = await res.json();
        
        if (holidays && holidays.length > 0) {
          greetingHeadingEl.textContent = `Happy ${holidays[0].localName}${nameSuffix}! 🎉`;
        } else {
          updateTimeBasedGreeting();
        }
      } catch (err) {
        updateTimeBasedGreeting();
      }
    }

    function applyGreetingPreference() {
      const mode = greetingStyleSelect ? greetingStyleSelect.value : 'time-based';
      if (mode === 'holiday-api') {
        fetchHolidayGreeting();
      } else {
        updateTimeBasedGreeting();
      }
    }

    // Strictly Subject-Accurate Quote Fetcher
    async function fetchQuote() {
      quoteTextEl.textContent = "Fetching quote...";
      quoteAuthorEl.textContent = "";

      const selectedCategory = categorySelect.value || 'philosophy';
      const selectedOptionText = categorySelect.options[categorySelect.selectedIndex].text.trim();
      quoteCategoryLabelEl.textContent = `Quote • ${selectedOptionText}`;

      const tag = QUOTE_TAG_MAP[selectedCategory] || 'famous-quotes';
      const apiUrl = `https://api.quotable.io/random?tags=${tag}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch(apiUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            quoteTextEl.textContent = `"${data.content}"`;
            quoteAuthorEl.textContent = `— ${data.author || 'Unknown'}`;
            return;
          }
        }
      } catch (err) {
        console.warn("API quote fetch failed/timed out, using category curated quote:", err.message);
      }

      // Fallback: Pick guaranteed subject-matched quote from local database
      const categoryQuotes = QUOTE_DATABASE[selectedCategory] || QUOTE_DATABASE.philosophy;
      const randomQuote = categoryQuotes[Math.floor(Math.random() * categoryQuotes.length)];

      quoteTextEl.textContent = `"${randomQuote.text}"`;
      quoteAuthorEl.textContent = `— ${randomQuote.author}`;
    }

    // Fact Fetcher
    async function fetchFact() {
      factTextEl.textContent = "Fetching fact...";

      const selectedTopic = factTopicSelect.value || 'useless';
      const selectedOptionText = factTopicSelect.options[factTopicSelect.selectedIndex].text.trim();
      factCategoryLabelEl.textContent = `Fact • ${selectedOptionText}`;

      const backupList = LOCAL_FACT_BACKUPS[selectedTopic] || LOCAL_FACT_BACKUPS.useless;
      const randomFact = backupList[Math.floor(Math.random() * backupList.length)];

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random?language=en', { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data && data.text) {
            factTextEl.textContent = data.text;
            return;
          }
        }
      } catch (err) {
        console.warn("Fact API fetch failed, using local fallback.");
      }

      factTextEl.textContent = randomFact;
    }

    function loadNewContent() {
      applyGreetingPreference();
      fetchQuote();
      fetchFact();
    }

    function randomizeEverything() {
      const themes = Array.from(themeSelect.options).map(opt => opt.value);
      const randomTheme = themes[Math.floor(Math.random() * themes.length)];
      themeSelect.value = randomTheme;
      document.body.className = `${randomTheme} min-h-screen font-sans antialiased`;

      const quoteCategories = Array.from(categorySelect.options).map(opt => opt.value);
      const randomCategory = quoteCategories[Math.floor(Math.random() * quoteCategories.length)];
      categorySelect.value = randomCategory;

      const factTopics = Array.from(factTopicSelect.options).map(opt => opt.value);
      const randomTopic = factTopics[Math.floor(Math.random() * factTopics.length)];
      factTopicSelect.value = randomTopic;

      loadNewContent();
      showToast("Randomized theme, quote, and fact!");
    }

    function openDrawer() {
      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    function copyToClipboard(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`Copied ${label} to clipboard!`);
        }).catch(() => {
          fallbackCopyText(text, label);
        });
      } else {
        fallbackCopyText(text, label);
      }
    }

    function fallbackCopyText(text, label) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(`Copied ${label} to clipboard!`);
      } catch (err) {
        showToast("Failed to copy text.");
      }
      document.body.removeChild(textArea);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadNewContent();

      refreshBtn.addEventListener('click', loadNewContent);

      if (randomizeBtn) {
        randomizeBtn.addEventListener('click', randomizeEverything);
      }

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.code === 'Space') {
          e.preventDefault();
          loadNewContent();
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          randomizeEverything();
        }
      });

      openDrawerBtn.addEventListener('click', openDrawer);
      closeDrawerBtn.addEventListener('click', closeDrawer);
      backdrop.addEventListener('click', closeDrawer);

      copyQuoteBtn.addEventListener('click', () => {
        const fullQuote = `${quoteTextEl.textContent} ${quoteAuthorEl.textContent}`;
        copyToClipboard(fullQuote, 'quote');
      });

      copyFactBtn.addEventListener('click', () => {
        copyToClipboard(factTextEl.textContent, 'fact');
      });

      saveSettingsBtn.addEventListener('click', () => {
        const selectedTheme = themeSelect.value;
        document.body.className = `${selectedTheme} min-h-screen font-sans antialiased`;
        loadNewContent();
        closeDrawer();
        showToast("Preferences & Topics updated!");
      });

      const updateClock = () => {
        const now = new Date();
        document.getElementById('current-date').textContent = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        document.getElementById('current-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      updateClock();
      setInterval(updateClock, 60000);
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
