<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Spark - Inspiration & Facts</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-philosophy min-h-screen font-sans antialiased">

  <div class="bg-overlay"></div>

  <!-- MAIN APP CONTAINER -->
  <main class="main-screen">
    <header class="top-nav">
      <div class="header-center">
        <!-- DYNAMIC TIME-BASED GREETING -->
        <h1 id="greeting-heading" class="greeting-heading">Daily Spark</h1>
        <div class="datetime-widget">
          <span id="current-date">Today</span>
          <span class="dot-separator">•</span>
          <span id="current-time">12:00 PM</span>
        </div>
        <p class="tagline">Your daily dose of quotes & fascinating trivia</p>
      </div>

      <!-- Hamburger Menu Button -->
      <button id="open-drawer-btn" class="hamburger-btn" aria-label="Open Settings">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </header>

    <!-- CONTENT CARDS -->
    <section class="content-wrapper">
      <div class="content-container">

        <!-- QUOTE CARD -->
        <article class="card animate-in">
          <div class="card-header-row">
            <span class="card-label">Quote of the Day</span>
            <div class="card-actions-mini">
              <button id="copy-quote-btn" class="icon-btn" title="Copy Quote">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
          <div class="quote-body">
            <p id="quote-text">"Loading quote..."</p>
          </div>
          <p id="quote-author" class="author">— Author</p>
        </article>

        <!-- FACT CARD -->
        <article class="card animate-in">
          <div class="card-header-row">
            <span class="card-label">Random Fact</span>
            <div class="card-actions-mini">
              <button id="copy-fact-btn" class="icon-btn" title="Copy Fact">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
          <div class="fact-card">
            <p id="fact-text">Loading random fact...</p>
          </div>
        </article>

        <!-- GENERATE BUTTON & HINT -->
        <div class="actions">
          <button id="fetch-new-btn" class="btn primary-btn">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Get New Spark</span>
          </button>
        </div>
        <p class="keyboard-hint mt-2">Press <kbd>Spacebar</kbd> to refresh</p>

      </div>
    </section>
  </main>

  <!-- DRAWER BACKDROP OVERLAY -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <!-- SLIDE-OUT SETTINGS DRAWER -->
  <aside id="settings-drawer" class="drawer">
    <div class="drawer-header">
      <h3>Preferences</h3>
      <button id="close-drawer-btn" class="close-btn" aria-label="Close Settings">&times;</button>
    </div>

    <form id="settings-form" onsubmit="event.preventDefault();">
      <!-- Theme Selection -->
      <div class="form-group">
        <label for="theme-select">App Visual Theme</label>
        <select id="theme-select">
          <option value="theme-philosophy">Philosophy & Wisdom</option>
          <option value="theme-movie">Iconic Movies</option>
          <option value="theme-athlete">Athletic Greatness</option>
          <option value="theme-lyrics">Song Lyrics</option>
          <option value="theme-cyberpunk">Cyberpunk Neon</option>
          <option value="theme-forest">Emerald Forest</option>
          <option value="theme-sunset">Sunset Serenade</option>
          <option value="theme-nordic">Nordic Frost</option>
        </select>
      </div>

      <!-- Quote Category Selection -->
      <div class="form-group">
        <label for="category-select">Quote Category API Endpoint</label>
        <select id="category-select">
          <option value="philosophy">Philosophy / General</option>
          <option value="inspirational">Inspirational (ZenQuotes)</option>
          <option value="history">History Trivia</option>
        </select>
      </div>

      <!-- Greeting Display Mode Option -->
      <div class="form-group">
        <label for="greeting-style-select">Greeting Mode</label>
        <select id="greeting-style-select">
          <option value="time-based">Time-of-Day Greeting (Morning/Afternoon/Evening)</option>
          <option value="holiday-api">Today's Holiday / Observance (Calendarific API)</option>
        </select>
      </div>

      <button id="save-settings-btn" class="btn primary-btn w-full mt-20" type="button">
        Save Preferences
      </button>
    </form>
  </aside>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast-message">Copied to clipboard!</div>

  <!-- JAVASCRIPT INTEGRATION LOGIC -->
  <script>
    // --- API ENDPOINT MAPPINGS ---
    const API_SOURCES = {
      dummyJson: 'https://dummyjson.com/quotes/random',
      zenQuotes: 'https://api.allorigins.win/raw?url=https://zenquotes.io/api/random',
      uselessFacts: 'https://uselessfacts.jsph.pl/api/v2/facts/random?language=en',
      // Public Holidays API (No key required for general country holiday detection)
      publicHolidays: 'https://date.nager.at/api/v3/NextPublicHolidaysWorldwide'
    };

    // --- FALLBACK LOCAL DATA (In case of network/offline issues) ---
    const FALLBACK_QUOTES = [
      { quote: "The only true wisdom is in knowing you know nothing.", author: "Socrates" },
      { quote: "It always seems impossible until it's done.", author: "Nelson Mandela" },
      { quote: "Life is what happens when you're busy making other plans.", author: "John Lennon" }
    ];

    const FALLBACK_FACTS = [
      "Honey never spoils. Archaeologists have found 3,000-year-old edible honey in Egyptian tombs.",
      "A day on Venus is longer than a year on Venus.",
      "Bananas are naturally slightly radioactive because they contain high levels of potassium."
    ];

    // --- DOM ELEMENTS ---
    const greetingHeadingEl = document.getElementById('greeting-heading');
    const quoteTextEl = document.getElementById('quote-text');
    const quoteAuthorEl = document.getElementById('quote-author');
    const factTextEl = document.getElementById('fact-text');
    const refreshBtn = document.getElementById('fetch-new-btn');
    const drawer = document.getElementById('settings-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    const openDrawerBtn = document.getElementById('open-drawer-btn');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const themeSelect = document.getElementById('theme-select');
    const greetingStyleSelect = document.getElementById('greeting-style-select');
    const toast = document.getElementById('toast');

    // --- TIME-OF-DAY GREETING LOGIC ---
    function updateTimeBasedGreeting() {
      const now = new Date();
      const hour = now.getHours();

      let greeting = "Hello & Welcome";

      if (hour >= 5 && hour < 12) {
        greeting = "Good Morning ☀️";
      } else if (hour >= 12 && hour < 17) {
        greeting = "Good Afternoon 🌤️";
      } else if (hour >= 17 && hour < 22) {
        greeting = "Good Evening 🌙";
      } else {
        greeting = "Good Night ✨";
      }

      greetingHeadingEl.textContent = greeting;
    }

    // --- OPTIONAL HOLIDAY/OBSERVANCE API GREETING ---
    async function fetchHolidayGreeting() {
      try {
        const res = await fetch(API_SOURCES.publicHolidays);
        if (!res.ok) throw new Error("Holiday API failed");
        const holidays = await res.json();
        
        if (holidays && holidays.length > 0) {
          const nearestHoliday = holidays[0];
          greetingHeadingEl.textContent = `Happy ${nearestHoliday.localName}! 🎉`;
        } else {
          updateTimeBasedGreeting();
        }
      } catch (err) {
        console.warn("Using default time-of-day greeting:", err);
        updateTimeBasedGreeting();
      }
    }

    // --- UPDATE GREETING BASED ON USER PREFERENCE ---
    function applyGreetingPreference() {
      const mode = greetingStyleSelect ? greetingStyleSelect.value : 'time-based';
      if (mode === 'holiday-api') {
        fetchHolidayGreeting();
      } else {
        updateTimeBasedGreeting();
      }
    }

    // --- FETCH QUOTE VIA PUBLIC API ---
    async function fetchQuote() {
      quoteTextEl.textContent = "Fetching quote...";
      quoteAuthorEl.textContent = "";

      try {
        const category = document.getElementById('category-select').value;
        let endpoint = API_SOURCES.dummyJson;

        if (category === 'inspirational') {
          endpoint = API_SOURCES.zenQuotes;
        }

        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("API request failed");

        const data = await res.json();

        if (Array.isArray(data) && data[0]?.q) {
          // ZenQuotes structure
          quoteTextEl.textContent = `"${data[0].q}"`;
          quoteAuthorEl.textContent = `— ${data[0].a}`;
        } else if (data.quote) {
          // DummyJSON structure
          quoteTextEl.textContent = `"${data.quote}"`;
          quoteAuthorEl.textContent = `— ${data.author}`;
        }
      } catch (err) {
        console.warn("Using fallback quote data:", err);
        const randomQuote = FALLBACK_QUOTES[Math.floor(Math.random() * FALLBACK_QUOTES.length)];
        quoteTextEl.textContent = `"${randomQuote.quote}"`;
        quoteAuthorEl.textContent = `— ${randomQuote.author}`;
      }
    }

    // --- FETCH FACT VIA PUBLIC API ---
    async function fetchFact() {
      factTextEl.textContent = "Fetching fact...";

      try {
        const res = await fetch(API_SOURCES.uselessFacts);
        if (!res.ok) throw new Error("API request failed");

        const data = await res.json();
        factTextEl.textContent = data.text;
      } catch (err) {
        console.warn("Using fallback fact data:", err);
        const randomFact = FALLBACK_FACTS[Math.floor(Math.random() * FALLBACK_FACTS.length)];
        factTextEl.textContent = randomFact;
      }
    }

    // --- MASTER REFRESH FUNCTION ---
    function loadNewContent() {
      applyGreetingPreference();
      fetchQuote();
      fetchFact();
    }

    // --- DRAWER CONTROLS ---
    function openDrawer() {
      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    // --- INITIALIZATION & EVENT LISTENERS ---
    document.addEventListener('DOMContentLoaded', () => {
      loadNewContent();

      // Refresh Button & Spacebar
      refreshBtn.addEventListener('click', loadNewContent);
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          loadNewContent();
        }
      });

      // Drawer Events
      openDrawerBtn.addEventListener('click', openDrawer);
      closeDrawerBtn.addEventListener('click', closeDrawer);
      backdrop.addEventListener('click', closeDrawer);

      // Save Preferences
      saveSettingsBtn.addEventListener('click', () => {
        const selectedTheme = themeSelect.value;
        document.body.className = `${selectedTheme} min-h-screen font-sans antialiased`;
        applyGreetingPreference();
        closeDrawer();
        showToast("Preferences saved!");
      });

      // Update Date & Time Display
      const now = new Date();
      document.getElementById('current-date').textContent = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      document.getElementById('current-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    });

    // Helper Toast Notification
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
