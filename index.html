<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Spark - Quotes & Fun Facts Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Space+Grotesk:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color, #0f172a);
      color: var(--text-main, #f8fafc);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Theme Variable Definitions */
    body.theme-philosophy {
      --bg-color: #12100e;
      --card-bg: rgba(28, 25, 23, 0.85);
      --input-bg: #272421;
      --text-main: #f5f5f4;
      --text-muted: #a8a29e;
      --accent: #d97706;
      --accent-hover: #b45309;
      --border-color: #44403c;
      --font-heading: 'Cinzel', serif;
    }

    body.theme-movie {
      --bg-color: #0d0d0d;
      --card-bg: rgba(26, 26, 26, 0.85);
      --input-bg: #262626;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --border-color: #404040;
      --font-heading: 'Playfair Display', serif;
    }

    body.theme-athlete {
      --bg-color: #0b132b;
      --card-bg: rgba(28, 37, 65, 0.85);
      --input-bg: #141b33;
      --text-main: #ffffff;
      --text-muted: #8d99ae;
      --accent: #48cae4;
      --accent-hover: #00b4d8;
      --border-color: #2b3a67;
      --font-heading: 'Space Grotesk', sans-serif;
    }

    body.theme-cyberpunk {
      --bg-color: #0d0e15;
      --card-bg: rgba(22, 24, 36, 0.85);
      --input-bg: #10121d;
      --text-main: #00f0ff;
      --text-muted: #7082a0;
      --accent: #ff007f;
      --accent-hover: #d6006b;
      --border-color: #2a2e45;
      --font-heading: 'Rajdhani', sans-serif;
    }

    body.theme-forest {
      --bg-color: #0b1d17;
      --card-bg: rgba(20, 46, 38, 0.85);
      --input-bg: #0f241d;
      --text-main: #e2f1ed;
      --text-muted: #7a9e93;
      --accent: #2a9d8f;
      --accent-hover: #218377;
      --border-color: #23473c;
      --font-heading: 'Cinzel', serif;
    }

    body.theme-sunset {
      --bg-color: #1a0f1c;
      --card-bg: rgba(41, 24, 45, 0.85);
      --input-bg: #201223;
      --text-main: #fceade;
      --text-muted: #aa889c;
      --accent: #e07a5f;
      --accent-hover: #c86348;
      --border-color: #422648;
      --font-heading: 'Playfair Display', serif;
    }

    body.theme-nordic {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --input-bg: #172033;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
      --font-heading: 'Space Grotesk', sans-serif;
    }

    /* Screen Visibility */
    .screen {
      display: none;
      width: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* Top Navigation Header */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 2rem;
      width: 100%;
      max-w: 1200px;
      margin: 0 auto;
    }

    .nav-spacer {
      width: 48px;
    }

    .header-title {
      text-align: center;
      flex-grow: 1;
    }

    .header-title h2 {
      font-family: var(--font-heading), sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .datetime-widget {
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Hamburger Button */
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      border-color: var(--accent);
    }
    .icon-btn .bar {
      width: 18px;
      height: 2px;
      background-color: var(--text-main);
      border-radius: 2px;
    }

    /* Main Container & Cards */
    .content-container {
      max-width: 680px;
      width: 90%;
      margin: 1rem auto 3rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 700;
      display: block;
      margin-bottom: 0.75rem;
    }

    .quote-card blockquote p {
      font-family: var(--font-heading), serif;
      font-size: 1.35rem;
      line-height: 1.6;
      color: var(--text-main);
      font-style: italic;
      margin-bottom: 1rem;
    }

    .quote-card .author {
      text-align: right;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .fact-card p {
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    /* Primary Action Buttons */
    .actions {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .btn {
      cursor: pointer;
      padding: 0.85rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .primary-btn {
      background-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.25);
    }
    .primary-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Forms & Inputs */
    .setup-card {
      text-align: center;
    }
    .setup-card h2 {
      font-family: var(--font-heading), serif;
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }
    .setup-card .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    /* Drawer Styles */
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 360px;
      background-color: var(--card-bg);
      backdrop-filter: blur(16px);
      border-left: 1px solid var(--border-color);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 2rem;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    }
    .drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .drawer-header h3 {
      font-family: var(--font-heading), sans-serif;
      font-size: 1.25rem;
      color: var(--text-main);
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .close-btn:hover {
      color: var(--text-main);
    }

    /* Animations */
    .animate-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="theme-philosophy">

            <option value="lyrics">🎵 Song Lyrics</option>

        </div>

        <button type="submit" id="start-btn" class="btn primary-btn w-full">
          <span>Start Exploring</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main Screen UI -->

        <p id="quote-author" class="author">— Socrates</p>

      <!-- Fun Fact Card -->
      <div class="card fact-card">
        <span class="card-label">Did You Know?</span>
        <p id="fact-text">A day on Venus is longer than a year on Venus.</p>
      </div>

      <!-- Action Controls -->
      <div class="actions">
        <button id="regenerate-btn" class="btn primary-btn">
          <span>Spark New Thought</span>
        </button>
      </div>

    </main>

    <!-- Settings Drawer -->
    <div id="settings-drawer" class="drawer">
      <div class="drawer-content">
        <div class="drawer-header">
          <h3>Settings</h3>
          <button id="close-drawer-btn" class="close-btn">&times;</button>
        </div>

        <div class="form-group">
          <label for="settings-name">Your Name</label>
          <input type="text" id="settings-name">
        </div>

        <div class="form-group">
          <label for="settings-category">Quote Category</label>
          <select id="settings-category">
            <option value="all">🌟 All Categories</option>
            <option value="philosophy">🧠 Philosophy & Wisdom</option>
            <option value="movie">🎬 Iconic Movies</option>
            <option value="athlete">🏆 Athletes & Champions</option>
            <option value="lyrics">🎵 Song Lyrics</option>
          </select>
        </div>

        <div class="form-group">
          <label for="settings-theme">Color Palette Theme</label>
          <select id="settings-theme">
            <option value="auto">✨ Auto Dynamic (Matches Category)</option>
            <option value="philosophy">📜 Philosophy (Marble & Gold)</option>

        <button id="save-settings-btn" class="btn primary-btn w-full mt-4">Save Changes</button>
      </div>
    </div>
  </div>

    const quoteCategoryLabel = document.getElementById("quote-category-label");
    const factText = document.getElementById("fact-text");
    const regenerateBtn = document.getElementById("regenerate-btn");

    const hamburgerBtn = document.getElementById("hamburger-btn");
    const settingsDrawer = document.getElementById("settings-drawer");
    const closeDrawerBtn = document.getElementById("close-drawer-btn");
    const saveSettingsBtn = document.getElementById("save-settings-btn");
    const settingsName = document.getElementById("settings-name");
    const settingsCategory = document.getElementById("settings-category");
    const settingsTheme = document.getElementById("settings-theme");

    function getTimeBasedGreeting(name) {
      const currentHour = new Date().getHours();
      if (currentHour >= 5 && currentHour < 12) {
        return {
          title: `Good morning, ${name}!`,
          tagline: "I hope your morning is treating you well and your day starts on a bright note."
        };
      } else if (currentHour >= 12 && currentHour < 17) {
        return {
          title: `Good afternoon, ${name}!`,
          tagline: "I hope your afternoon is treating you well and keeping you inspired."
        };
      } else if (currentHour >= 17 && currentHour < 22) {
        return {
          title: `Good evening, ${name}!`,
          tagline: "I hope your evening is treating you well as you unwind and relax."
        };
      } else {
        return {
          title: `Good night, ${name}!`,
          tagline: "I hope your night is treating you well and brings you restful peace."
        };
      }
    }

    function updateGreetingHeader() {
      const name = userState.name || "Friend";
      const { title, tagline } = getTimeBasedGreeting(name);
      if (greetingText) greetingText.textContent = title;
      const taglineEl = document.querySelector(".tagline");
      if (taglineEl) taglineEl.textContent = tagline;
    }

    function updateDateTime() {
      const now = new Date();
      const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      if (liveDate) liveDate.textContent = now.toLocaleDateString(undefined, dateOptions);
      
      const timeOptions = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true };
      if (liveTime) liveTime.textContent = now.toLocaleTimeString(undefined, timeOptions);

      updateGreetingHeader();
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function getUniqueRandomItem(pool, recentArray, keyFn = (item) => item, historyLimit = REPEAT_THRESHOLD) {
      let availableItems = pool.filter(item => !recentArray.includes(keyFn(item)));
      if (availableItems.length === 0) availableItems = pool;

      const selected = getRandomItem(availableItems);
      const selectedKey = keyFn(selected);

      recentArray.push(selectedKey);
      if (recentArray.length > historyLimit) recentArray.shift();

      return selected;
    }

    function applyTheme(themeValue, currentCategory) {
      let activeTheme = themeValue;
      if (themeValue === "auto") {
        activeTheme = currentCategory === "all" ? "philosophy" : (currentCategory === "lyrics" ? "cyberpunk" : currentCategory);
      }
      
      document.body.classList.remove(
        'theme-philosophy', 
        'theme-movie', 
        'theme-athlete', 
        'theme-cyberpunk', 
        'theme-forest', 
        'theme-sunset', 
        'theme-nordic'
      );
      document.body.classList.add(`theme-${activeTheme}`);
    }

    function generateContent() {
      let selectedCategory = userState.category;
      if (selectedCategory === "all") {
        const categories = ["philosophy", "movie", "athlete", "lyrics"];
        selectedCategory = getRandomItem(categories);
      }

      const pool = quoteData[selectedCategory] || quoteData.philosophy;
      const randomQuote = getUniqueRandomItem(pool, recentQuotes, (q) => `${q.quote}-${q.author}`);
      const randomFact = getUniqueRandomItem(factData, recentFacts, (f) => f);

      if (quoteText) quoteText.textContent = `"${randomQuote.quote}"`;
      if (quoteAuthor) quoteAuthor.textContent = `— ${randomQuote.author}`;
      if (quoteCategoryLabel) quoteCategoryLabel.textContent = `${selectedCategory.toUpperCase()} Quote`;
      if (factText) factText.textContent = randomFact;

      applyTheme(userState.theme, selectedCategory);
    }

    function triggerAnimation() {
      const container = document.querySelector(".content-container");
      if (!container) return;
      container.classList.remove("animate-in");
      void container.offsetWidth; 
      container.classList.add("animate-in");
    }

    if (setupForm) {
      setupForm.addEventListener("submit", (e) => {
        e.preventDefault();
        userState.name = usernameInput ? usernameInput.value.trim() || "Friend" : "Friend";
        userState.category = categorySelect ? categorySelect.value : "all";

        updateGreetingHeader();

        if (setupScreen) {
          setupScreen.classList.remove("active");
          setupScreen.style.display = "none";
        }
        if (mainScreen) {
          mainScreen.classList.add("active");
          mainScreen.style.display = "flex";
        }

        generateContent();
        triggerAnimation();
      });
    }

    if (regenerateBtn) {
      regenerateBtn.addEventListener("click", () => {
        generateContent();
        triggerAnimation();
      });
    }

    if (hamburgerBtn) {
      hamburgerBtn.addEventListener("click", () => {
        if (settingsName) settingsName.value = userState.name;
        if (settingsCategory) settingsCategory.value = userState.category;
        if (settingsTheme) settingsTheme.value = userState.theme;
        
        if (settingsDrawer) {
          settingsDrawer.classList.add("open");
        }
      });
    }

    if (closeDrawerBtn) {
      closeDrawerBtn.addEventListener("click", () => {
        if (settingsDrawer) {
          settingsDrawer.classList.remove("open");
        }
      });
    }

    if (saveSettingsBtn) {
      saveSettingsBtn.addEventListener("click", () => {
        if (settingsName) userState.name = settingsName.value.trim() || userState.name;
        if (settingsCategory) userState.category = settingsCategory.value;
        if (settingsTheme) userState.theme = settingsTheme.value;

        updateGreetingHeader();
        generateContent();
        triggerAnimation();

        if (settingsDrawer) {
          settingsDrawer.classList.remove("open");
        }
      });
    }
  </script>
</body>
</html>
