<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Spark - Quotes & Fun Facts Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Space+Grotesk:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="theme-philosophy min-h-screen flex flex-col justify-between">

  <!-- Setup Screen -->
  <div id="setup-screen" class="screen active fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="card setup-card w-full max-w-md shadow-2xl animate-in">
      <h2>Daily Spark</h2>
      <p class="subtitle">Get inspired with curated quotes & mind-blowing fun facts tailored for you.</p>

      <form id="setup-form" class="space-y-4 text-left">
        <div class="form-group">
          <label for="username">Your Name</label>
          <input type="text" id="username" placeholder="e.g. Alex" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="category">Preferred Quote Category</label>
          <select id="category">
            <option value="all">🌟 All Categories (Random)</option>
            <option value="philosophy">🧠 Philosophy & Wisdom</option>
            <option value="movie">🎬 Iconic Movie Lines</option>
            <option value="athlete">🏆 Athletic Greatness</option>
            <option value="lyrics">🎵 Song Lyrics</option>
          </select>
        </div>

        <button type="submit" id="start-btn" class="btn primary-btn">
          <span>Start Exploring</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main Screen UI -->
  <div id="main-screen" class="screen flex-col min-h-screen">
    <!-- Fixed Top Navigation Header -->
    <header class="top-nav">
      <!-- Empty left spacer to maintain true center for the title card -->
      <div class="nav-spacer"></div>

      <!-- Centered Greeting Title & Date/Time Display -->
      <div class="header-title">
        <h2 id="greeting-text" class="text-xl font-bold">Hello, Friend!</h2>
        <div id="datetime-widget" class="datetime-widget">
          <span id="live-date" class="date-text"></span>
          <span class="dot-separator">•</span>
          <span id="live-time" class="time-text"></span>
        </div>
        <p class="tagline">Here's your daily dose of insight</p>
      </div>

      <!-- Hamburger Menu Button in Top Right -->
      <div class="nav-right">
        <button id="hamburger-btn" title="Settings" class="icon-btn">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="content-container animate-in">

      <!-- Quote Card -->
      <div class="card quote-card">
        <span id="quote-category-label" class="card-label">Philosophy Quote</span>
        <blockquote>
          <p id="quote-text">"The unexamined life is not worth living."</p>
        </blockquote>
        <p id="quote-author" class="author">— Socrates</p>
      </div>

      <!-- Fun Fact Card -->
      <div class="card fact-card">
        <span class="card-label">Did You Know?</span>
        <p id="fact-text">A day on Venus is longer than a year on Venus.</p>
      </div>

      <!-- Action Controls -->
      <div class="actions">
        <button id="regenerate-btn" class="btn primary-btn">
          <span>Spark New Thought</span>
        </button>
      </div>

    </main>

    <!-- Settings Drawer -->
    <div id="settings-drawer" class="drawer">
      <div class="drawer-content">
        <div class="drawer-header">
          <h3>Settings</h3>
          <button id="close-drawer-btn" class="close-btn">&times;</button>
        </div>

        <div class="form-group">
          <label for="settings-name">Your Name</label>
          <input type="text" id="settings-name">
        </div>

        <div class="form-group">
          <label for="settings-category">Quote Category</label>
          <select id="settings-category">
            <option value="all">🌟 All Categories</option>
            <option value="philosophy">🧠 Philosophy & Wisdom</option>
            <option value="movie">🎬 Iconic Movies</option>
            <option value="athlete">🏆 Athletes & Champions</option>
            <option value="lyrics">🎵 Song Lyrics</option>
          </select>
        </div>

        <div class="form-group">
          <label for="settings-theme">Color Palette Theme</label>
          <select id="settings-theme">
            <option value="auto">✨ Auto Dynamic (Matches Category)</option>
            <option value="philosophy">📜 Philosophy (Marble & Gold)</option>
            <option value="movie">🎬 Movie (Cinematic Dark)</option>
            <option value="athlete">⚡ Athlete (High Contrast Cyan)</option>
            <option value="cyberpunk">🌆 Cyberpunk (Neon Magenta)</option>
            <option value="forest">🌲 Emerald Forest (Deep Pine & Mint)</option>
            <option value="sunset">🌅 Sunset Serenade (Warm Coral & Plum)</option>
            <option value="nordic">❄️ Nordic Frost (Cool Slate & Glacial Blue)</option>
          </select>
        </div>

        <button id="save-settings-btn" class="btn primary-btn">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
