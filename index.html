<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Spark - Inspiration & Facts</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-philosophy min-h-screen font-sans antialiased">

  <div class="bg-overlay"></div>

  <!-- MAIN APP CONTAINER -->
  <main class="main-screen">
    <header class="top-nav">
      <div class="header-center">
        <!-- DYNAMIC TIME-BASED GREETING -->
        <h1 id="greeting-heading" class="greeting-heading">Daily Spark</h1>
        <div class="datetime-widget">
          <span id="current-date">Today</span>
          <span class="dot-separator">•</span>
          <span id="current-time">12:00 PM</span>
        </div>
        <p class="tagline">Your daily dose of quotes & fascinating trivia</p>
      </div>

      <!-- Hamburger Menu Button -->
      <button id="open-drawer-btn" class="hamburger-btn" aria-label="Open Settings">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </header>

    <!-- CONTENT CARDS -->
    <section class="content-wrapper">
      <div class="content-container">

        <!-- QUOTE CARD -->
        <article class="card animate-in">
          <div class="card-header-row">
            <span id="quote-category-label" class="card-label">Quote • Wisdom & Philosophy</span>
            <div class="card-actions-mini">
              <button id="copy-quote-btn" class="icon-btn" title="Copy Quote">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
          <div class="quote-body">
            <p id="quote-text">"Loading quote..."</p>
          </div>
          <p id="quote-author" class="author">— Author</p>
        </article>

        <!-- FACT CARD -->
        <article class="card animate-in">
          <div class="card-header-row">
            <span id="fact-category-label" class="card-label">Fact • General Trivia</span>
            <div class="card-actions-mini">
              <button id="copy-fact-btn" class="icon-btn" title="Copy Fact">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
          <div class="fact-card">
            <p id="fact-text">Loading random fact...</p>
          </div>
        </article>

        <!-- GENERATE BUTTON & HINT -->
        <div class="actions">
          <button id="fetch-new-btn" class="btn primary-btn">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Get New Spark</span>
          </button>
        </div>
        <p class="keyboard-hint mt-2">Press <kbd>Spacebar</kbd> to refresh</p>

      </div>
    </section>
  </main>

  <!-- DRAWER BACKDROP OVERLAY -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <!-- SLIDE-OUT SETTINGS DRAWER -->
  <aside id="settings-drawer" class="drawer">
    <div class="drawer-header">
      <h3>Preferences & Topics</h3>
      <button id="close-drawer-btn" class="close-btn" aria-label="Close Settings">&times;</button>
    </div>

    <form id="settings-form" onsubmit="event.preventDefault();">
      <!-- Theme Selection -->
      <div class="form-group">
        <label for="theme-select"><i class="fa-solid fa-palette mr-2"></i>App Visual Theme</label>
        <select id="theme-select">
          <option value="theme-philosophy">Philosophy & Wisdom</option>
          <option value="theme-inspirational">Inspirational & Life</option>
          <option value="theme-technology">Technology & Science</option>
          <option value="theme-history">History & Classics</option>
          <option value="theme-literature">Literature & Poetry</option>
          <option value="theme-sports">Athletics & Competition</option>
          <option value="theme-forest">Emerald Forest</option>
          <option value="theme-nordic">Nordic Frost</option>
        </select>
      </div>

      <!-- Quote Category Selection -->
      <div class="form-group">
        <label for="category-select"><i class="fa-solid fa-quote-left mr-2"></i>Quote Subject</label>
        <select id="category-select">
          <option value="philosophy">Wisdom & Philosophy (DummyJSON API)</option>
          <option value="inspirational">Inspirational & Life (ZenQuotes API)</option>
          <option value="technology">Technology & Science (Quotable API)</option>
          <option value="history">Historical & Classics (Quotable API)</option>
          <option value="literature">Literature & Poetry (Quotable API)</option>
          <option value="sports">Athletics & Competition (Quotable API)</option>
        </select>
      </div>

      <!-- Fact Topic Selection -->
      <div class="form-group">
        <label for="fact-topic-select"><i class="fa-solid fa-lightbulb mr-2"></i>Fact Topic</label>
        <select id="fact-topic-select">
          <option value="useless">General Trivia & Fun Facts (UselessFacts API)</option>
          <option value="trivia">Math & Number Trivia (Numbers API)</option>
          <option value="date">Historical Events & Dates (Numbers API)</option>
          <option value="year">Year in History Trivia (Numbers API)</option>
        </select>
      </div>

      <!-- Greeting Display Mode Option -->
      <div class="form-group">
        <label for="greeting-style-select"><i class="fa-solid fa-clock mr-2"></i>Greeting Header</label>
        <select id="greeting-style-select">
          <option value="time-based">Time-of-Day Greeting (Morning/Afternoon/Evening)</option>
          <option value="holiday-api">Today's Holiday / Observance (Nager.Date API)</option>
        </select>
      </div>

      <button id="save-settings-btn" class="btn primary-btn w-full mt-20" type="button">
        Save Preferences
      </button>
    </form>
  </aside>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast-message">Copied to clipboard!</div>

  <!-- JAVASCRIPT INTEGRATION LOGIC -->
  <script>
    // --- API ENDPOINT MAPPINGS BY SUBJECT/TOPIC ---
    const QUOTE_ENDPOINTS = {
      philosophy: 'https://dummyjson.com/quotes/random',
      inspirational: 'https://api.allorigins.win/raw?url=https://zenquotes.io/api/random',
      technology: 'https://api.quotable.io/quotes/random?tags=technology',
      history: 'https://api.quotable.io/quotes/random?tags=history',
      literature: 'https://api.quotable.io/quotes/random?tags=literature',
      sports: 'https://api.quotable.io/quotes/random?tags=sports'
    };

    const FACT_ENDPOINTS = {
      useless: 'https://uselessfacts.jsph.pl/api/v2/facts/random?language=en',
      trivia: 'https://numbersapi.com/random/trivia?json',
      date: 'https://numbersapi.com/random/date?json',
      year: 'https://numbersapi.com/random/year?json'
    };

    const API_SOURCES = {
      publicHolidays: 'https://date.nager.at/api/v3/NextPublicHolidaysWorldwide'
    };

    // --- DOM ELEMENTS ---
    const greetingHeadingEl = document.getElementById('greeting-heading');
    const quoteTextEl = document.getElementById('quote-text');
    const quoteAuthorEl = document.getElementById('quote-author');
    const quoteCategoryLabelEl = document.getElementById('quote-category-label');
    const factTextEl = document.getElementById('fact-text');
    const factCategoryLabelEl = document.getElementById('fact-category-label');
    const refreshBtn = document.getElementById('fetch-new-btn');
    const drawer = document.getElementById('settings-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    const openDrawerBtn = document.getElementById('open-drawer-btn');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const themeSelect = document.getElementById('theme-select');
    const categorySelect = document.getElementById('category-select');
    const factTopicSelect = document.getElementById('fact-topic-select');
    const greetingStyleSelect = document.getElementById('greeting-style-select');
    const toast = document.getElementById('toast');
    const copyQuoteBtn = document.getElementById('copy-quote-btn');
    const copyFactBtn = document.getElementById('copy-fact-btn');

    // --- TIME-OF-DAY GREETING LOGIC ---
    function updateTimeBasedGreeting() {
      const now = new Date();
      const hour = now.getHours();
      let greeting = "Hello & Welcome";

      if (hour >= 5 && hour < 12) greeting = "Good Morning ☀️";
      else if (hour >= 12 && hour < 17) greeting = "Good Afternoon 🌤️";
      else if (hour >= 17 && hour < 22) greeting = "Good Evening 🌙";
      else greeting = "Good Night ✨";

      greetingHeadingEl.textContent = greeting;
    }

    // --- HOLIDAY / OBSERVANCE API GREETING ---
    async function fetchHolidayGreeting() {
      try {
        const res = await fetch(API_SOURCES.publicHolidays);
        if (!res.ok) throw new Error("Holiday API failed");
        const holidays = await res.json();
        
        if (holidays && holidays.length > 0) {
          greetingHeadingEl.textContent = `Happy ${holidays[0].localName}! 🎉`;
        } else {
          updateTimeBasedGreeting();
        }
      } catch (err) {
        updateTimeBasedGreeting();
      }
    }

    function applyGreetingPreference() {
      const mode = greetingStyleSelect ? greetingStyleSelect.value : 'time-based';
      if (mode === 'holiday-api') {
        fetchHolidayGreeting();
      } else {
        updateTimeBasedGreeting();
      }
    }

    // --- FETCH QUOTE DIRECTLY FROM API ---
    async function fetchQuote() {
      quoteTextEl.textContent = "Fetching quote...";
      quoteAuthorEl.textContent = "";

      const selectedCategory = categorySelect.value || 'philosophy';
      const selectedOptionText = categorySelect.options[categorySelect.selectedIndex].text.split('(')[0].trim();
      quoteCategoryLabelEl.textContent = `Quote • ${selectedOptionText}`;

      try {
        const endpoint = QUOTE_ENDPOINTS[selectedCategory] || QUOTE_ENDPOINTS.philosophy;
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);

        const data = await res.json();

        if (Array.isArray(data) && data[0]?.q) {
          // ZenQuotes structure
          quoteTextEl.textContent = `"${data[0].q}"`;
          quoteAuthorEl.textContent = `— ${data[0].a}`;
        } else if (Array.isArray(data) && data[0]?.content) {
          // Quotable array structure
          quoteTextEl.textContent = `"${data[0].content}"`;
          quoteAuthorEl.textContent = `— ${data[0].author}`;
        } else if (data.content) {
          // Quotable single object
          quoteTextEl.textContent = `"${data.content}"`;
          quoteAuthorEl.textContent = `— ${data.author}`;
        } else if (data.quote) {
          // DummyJSON structure
          quoteTextEl.textContent = `"${data.quote}"`;
          quoteAuthorEl.textContent = `— ${data.author}`;
        } else {
          throw new Error("Unrecognized quote payload structure");
        }
      } catch (err) {
        console.error("Quote API Fetch Error:", err);
        quoteTextEl.textContent = "Unable to load quote from API. Please check your network connection and try again.";
        quoteAuthorEl.textContent = "— API Unavailable";
      }
    }

    // --- FETCH FACT DIRECTLY FROM API ---
    async function fetchFact() {
      factTextEl.textContent = "Fetching fact...";

      const selectedTopic = factTopicSelect.value || 'useless';
      const selectedOptionText = factTopicSelect.options[factTopicSelect.selectedIndex].text.split('(')[0].trim();
      factCategoryLabelEl.textContent = `Fact • ${selectedOptionText}`;

      try {
        const endpoint = FACT_ENDPOINTS[selectedTopic] || FACT_ENDPOINTS.useless;
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);

        const data = await res.json();

        if (data.text) {
          factTextEl.textContent = data.text;
        } else {
          throw new Error("Unrecognized fact payload structure");
        }
      } catch (err) {
        console.error("Fact API Fetch Error:", err);
        factTextEl.textContent = "Unable to load fact from API. Please check your network connection and try again.";
      }
    }

    // --- MASTER REFRESH FUNCTION ---
    function loadNewContent() {
      applyGreetingPreference();
      fetchQuote();
      fetchFact();
    }

    // --- DRAWER CONTROLS ---
    function openDrawer() {
      drawer.classList.add('open');
      backdrop.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    // --- COPY TO CLIPBOARD HELPERS ---
    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied ${label} to clipboard!`);
      }).catch(() => {
        showToast("Failed to copy text.");
      });
    }

    // --- INITIALIZATION & EVENT LISTENERS ---
    document.addEventListener('DOMContentLoaded', () => {
      loadNewContent();

      // Refresh Button & Spacebar
      refreshBtn.addEventListener('click', loadNewContent);
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          loadNewContent();
        }
      });

      // Drawer Events
      openDrawerBtn.addEventListener('click', openDrawer);
      closeDrawerBtn.addEventListener('click', closeDrawer);
      backdrop.addEventListener('click', closeDrawer);

      // Copy Buttons
      copyQuoteBtn.addEventListener('click', () => {
        const fullQuote = `${quoteTextEl.textContent} ${quoteAuthorEl.textContent}`;
        copyToClipboard(fullQuote, 'quote');
      });

      copyFactBtn.addEventListener('click', () => {
        copyToClipboard(factTextEl.textContent, 'fact');
      });

      // Save Preferences
      saveSettingsBtn.addEventListener('click', () => {
        const selectedTheme = themeSelect.value;
        document.body.className = `${selectedTheme} min-h-screen font-sans antialiased`;
        loadNewContent();
        closeDrawer();
        showToast("Preferences & Topics updated!");
      });

      // Update Date & Time Display
      const updateClock = () => {
        const now = new Date();
        document.getElementById('current-date').textContent = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        document.getElementById('current-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      updateClock();
      setInterval(updateClock, 60000);
    });

    // Helper Toast Notification
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
