<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Quote & Random Fact</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts for classy typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="theme-all">

  <!-- Setup Modal Screen -->
  <div id="setup-screen" class="screen active">
    <div class="card setup-card animate-in">
      <h2>Welcome</h2>
      <p class="subtitle">Customize your daily inspiration experience.</p>
      
      <form id="setup-form">
        <div class="form-group">
          <label for="username">What is your name?</label>
          <input type="text" id="username" placeholder="Enter your name" required autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="category">Choose Quote Category</label>
          <select id="category">
            <option value="all">All Categories</option>
            <option value="philosophy">Philosopher Quotes</option>
            <option value="movie">Movie Quotes</option>
            <option value="athlete">Athlete Quotes</option>
          </select>
        </div>

        <button type="submit" class="btn primary-btn">Get Started</button>
      </form>
    </div>
  </div>

  <!-- Main Dashboard Screen -->
  <div id="main-screen" class="screen">
    <!-- Navigation / Header -->
    <header class="top-nav">
      <button id="hamburger-btn" class="icon-btn" aria-label="Open Settings">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </header>

    <!-- Content Area -->
    <main class="content-container animate-in">
      <h1 id="greeting-text">Hello!</h1>
      <p class="tagline">Here is your daily dose of wisdom and knowledge.</p>

      <!-- Quote Card -->
      <div class="card quote-card">
        <span class="card-label" id="quote-category-label">Quote</span>
        <blockquote id="quote-text">"Loading quote..."</blockquote>
        <p id="quote-author" class="author">— Author</p>
      </div>

      <!-- Fact Card -->
      <div class="card fact-card">
        <span class="card-label">Random Fact</span>
        <p id="fact-text">Loading fact...</p>
      </div>

      <!-- Action Button -->
      <button id="regenerate-btn" class="btn secondary-btn">Regenerate New Pair</button>
    </main>
  </div>

  <!-- Settings Drawer / Modal -->
  <div id="settings-drawer" class="drawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3>Settings</h3>
        <button id="close-drawer-btn" class="close-btn">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="form-group">
          <label for="settings-name">Name</label>
          <input type="text" id="settings-name" />
        </div>

        <div class="form-group">
          <label for="settings-category">Quote Category</label>
          <select id="settings-category">
            <option value="all">All Categories</option>
            <option value="philosophy">Philosopher Quotes</option>
            <option value="movie">Movie Quotes</option>
            <option value="athlete">Athlete Quotes</option>
          </select>
        </div>

        <div class="form-group">
          <label for="settings-theme">Visual Theme</label>
          <select id="settings-theme">
            <option value="auto">Auto (Match Category)</option>
            <option value="philosophy">Deep Marble (Philosophy)</option>
            <option value="movie">Cinematic Dark (Movie)</option>
            <option value="athlete">Vibrant Energy (Athlete)</option>
            <option value="all">Minimal Slate (Default)</option>
          </select>
        </div>

        <button id="save-settings-btn" class="btn primary-btn">Apply Changes</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
